name: Beta Deployment

on:
  push:
    branches:
      - beta

jobs:
  bump_version:
    name: Bump Build Number
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump build number
        id: bump
        run: |
          chmod +x scripts/auto-bump-version.sh scripts/get-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin beta || echo "⚠️ Pull failed, but continuing..."
          echo "📱 Current version:"
          ./scripts/get-version.sh
          ./scripts/auto-bump-version.sh build
          echo "✅ New version:"
          ./scripts/get-version.sh
          if git diff --quiet pubspec.yaml; then
            echo "ℹ️ No version changes detected, skipping commit"
            exit 0
          fi
          NEW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION (Beta) [skip ci]"
          for i in {1..3}; do
            if git push origin beta; then
              echo "✅ Successfully pushed version bump"
              exit 0
            else
              echo "⚠️ Push failed (attempt $i/3), pulling and retrying..."
              git pull --rebase origin beta
            fi
          done
          echo "❌ Failed to push after 3 attempts"
          exit 1

  build_android:
    name: Build and Deploy Android (Beta)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: bump_version
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      
      - name: Pull latest changes
        run: |
          git pull origin beta
          echo "📱 Current version after pull:"
          grep '^version:' pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-prod-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-prod-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      # Flutter 3.47 enables Swift Package Manager by default, which stops
      # SPM-migrated plugins from being declared as pods. google_mobile_ads
      # still declares webview_flutter_wkwebview as a podspec dependency, so
      # pod install then fails to resolve it. Lift this once google_mobile_ads
      # is upgraded and the project moves to SPM.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Clean build cache
        run: |
          flutter clean
          rm -rf build
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          ENVIRONMENT=production
          FIREBASE_PROD_WEB_API_KEY=${{ secrets.FIREBASE_PROD_WEB_API_KEY }}
          FIREBASE_PROD_WEB_APP_ID=${{ secrets.FIREBASE_PROD_WEB_APP_ID }}
          FIREBASE_PROD_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_PROD_WEB_MEASUREMENT_ID }}
          FIREBASE_PROD_ANDROID_API_KEY=${{ secrets.FIREBASE_PROD_ANDROID_API_KEY }}
          FIREBASE_PROD_ANDROID_APP_ID=${{ secrets.FIREBASE_PROD_ANDROID_APP_ID }}
          FIREBASE_PROD_IOS_API_KEY=${{ secrets.FIREBASE_PROD_IOS_API_KEY }}
          FIREBASE_PROD_IOS_APP_ID=${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
          FIREBASE_PROD_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}
          FIREBASE_PROD_PROJECT_ID=${{ secrets.FIREBASE_PROD_PROJECT_ID }}
          FIREBASE_PROD_AUTH_DOMAIN=${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}
          FIREBASE_PROD_STORAGE_BUCKET=${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}
          IOS_BUNDLE_ID=${{ secrets.IOS_BUNDLE_ID }}

          # Google Sign-In OAuth client IDs. Literals rather than secrets: OAuth client
          # IDs are public identifiers, and these exact values are already committed in
          # google-services.json and GoogleService-Info.plist. The client *secret* is
          # never needed here — the app only ever performs the public client flow.
          GOOGLE_OAUTH_WEB_CLIENT_ID_PROD=1069925301177-9lo5bht5kis83tpcsnd8lsi10au52878.apps.googleusercontent.com
          GOOGLE_OAUTH_IOS_CLIENT_ID_PROD=1069925301177-5mrbhfnct3l39g1vj6tlhvfmcug4vi11.apps.googleusercontent.com

          # Google Maps SDK keys. Restricted to the Maps SDK and bound to the iOS
          # bundle id / Android package + signing certs. Secrets, unlike the OAuth
          # client ids above: a Maps key is billable if it escapes its restrictions.
          GOOGLE_MAPS_IOS_API_KEY=${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          EOF

      - name: Create google-services.json for prod flavor
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          mkdir -p android/app/src/prod
          echo "$GOOGLE_SERVICES_JSON" > android/app/src/prod/google-services.json
          python3 -m json.tool android/app/src/prod/google-services.json > /dev/null 2>&1 || { echo "❌ Error: Invalid JSON"; exit 1; }
          echo "✅ google-services.json created and validated"

      - name: Setup Android Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << 'KEYSTORE_EOF'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          KEYSTORE_EOF

      - name: Verify google-services.json is for production
        run: |
          echo "🔍 Verifying google-services.json configuration..."
          if grep -q "maypole-flutter-ce6c3" android/app/src/prod/google-services.json; then
            echo "✅ Production google-services.json verified (maypole-flutter-ce6c3)"
          else
            echo "❌ ERROR: google-services.json is not for production!"
            grep "project_id" android/app/src/prod/google-services.json
            exit 1
          fi

      - name: Compare google-services.json with the committed copy
        run: |
          python3 -I - <<'PY'
          import json, subprocess, sys

          CONFIG = 'android/app/src/prod/google-services.json'
          PACKAGE = 'app.maypole.maypole'

          def inventory(data):
              """Project identity, plus the OAuth clients registered for our package."""
              info = data['project_info']
              clients = []
              for c in data.get('client', []):
                  if c['client_info']['android_client_info']['package_name'] != PACKAGE:
                      continue
                  for o in c.get('oauth_client', []):
                      clients.append((
                          o.get('client_type'),
                          o.get('android_info', {}).get('certificate_hash', ''),
                      ))
              return info['project_id'], info['project_number'], sorted(clients)

          def describe(clients):
              if not clients:
                  return 'none'
              return ', '.join(
                  f"type {t} {h or '(no hash)'}" for t, h in clients
              )

          # The working copy was just overwritten from GOOGLE_SERVICES_JSON_PROD, so the
          # committed version has to come from git rather than from disk.
          try:
              tracked_raw = subprocess.run(
                  ['git', 'show', f'HEAD:{CONFIG}'],
                  capture_output=True, text=True, check=True,
              ).stdout
          except subprocess.CalledProcessError:
              print(f'::warning::No committed copy of {CONFIG} at HEAD, so there is '
                    'nothing to compare the secret against.')
              sys.exit(0)

          with open(CONFIG) as fh:
              secret = json.load(fh)
          tracked = json.loads(tracked_raw)

          s_id, s_num, s_clients = inventory(secret)
          t_id, t_num, t_clients = inventory(tracked)

          print(f'committed: project {t_id} ({t_num}); OAuth clients: {describe(t_clients)}')
          print(f'secret:    project {s_id} ({s_num}); OAuth clients: {describe(s_clients)}')

          failed = False

          # Different projects is never benign: local builds would talk to one Firebase
          # backend and CI builds to another, under the same package name.
          if (s_id, s_num) != (t_id, t_num):
              print(f'::error::The committed {CONFIG} is project {t_id} ({t_num}) but '
                    f'GOOGLE_SERVICES_JSON_PROD is project {s_id} ({s_num}).')
              failed = True

          if s_clients != t_clients:
              only_committed = [c for c in t_clients if c not in s_clients]
              only_secret = [c for c in s_clients if c not in t_clients]
              parts = []
              if only_committed:
                  parts.append(f'committed only: {describe(only_committed)}')
              if only_secret:
                  parts.append(f'secret only: {describe(only_secret)}')
              print(f'::warning::GOOGLE_SERVICES_JSON_PROD and the committed {CONFIG} '
                    f'disagree about which OAuth clients are registered ({"; ".join(parts)}). '
                    'The secret is what ships. If it lists fewer, it is likely an older '
                    'download taken before the fingerprints were registered.')
          else:
              print('The committed copy and the secret agree.')

          if failed:
              sys.exit(1)
          PY

      - name: Verify Google Sign-In configuration (Android)
        run: |
          python3 -I - <<'PY'
          import json, re, sys

          CONFIG = 'android/app/src/prod/google-services.json'
          PACKAGE = 'app.maypole.maypole'
          failed = False

          with open(CONFIG) as fh:
              data = json.load(fh)

          project_number = data['project_info']['project_number']

          client = next(
              (c for c in data.get('client', [])
               if c['client_info']['android_client_info']['package_name'] == PACKAGE),
              None,
          )
          if client is None:
              print(f'::error::No client entry for {PACKAGE} in {CONFIG}.')
              sys.exit(1)

          oauth = client.get('oauth_client', [])
          android_clients = [
              o for o in oauth
              if o.get('client_type') == 1
              and o.get('android_info', {}).get('certificate_hash')
          ]
          web_clients = [o for o in oauth if o.get('client_type') == 3]

          if android_clients:
              print('Registered Android signing certificates:')
              for o in android_clients:
                  print(f"  SHA-1 {o['android_info']['certificate_hash']}")
              print('One of these must be the Play App Signing certificate. Play re-signs '
                    'the bundle it serves to testers, and Google matches the certificate '
                    'the installed app actually carries -- not the upload key.')
          else:
              print(f'::error::No Android OAuth client with a certificate hash in {CONFIG}. '
                    "Google will return a null ID token and sign-in will fail with "
                    "missing-google-id-token. Register this build's signing SHA-1 against "
                    'the Firebase Android app.')
              failed = True

          # GoogleSignIn.initialize is handed this as serverClientId, and Google uses
          # it as the ID token's audience. An audience that is not a real client of
          # this project is rejected outright -- `invalid_audience` at the token
          # endpoint -- so a plausible-looking but wrong value fails sign-in just as
          # surely as a missing one. Where this config names the project's own web
          # clients the injected value has to be one of them; where it names none,
          # nothing here can confirm it either way.
          env_text = open('.env').read()
          web_match = re.search(r'^GOOGLE_OAUTH_WEB_CLIENT_ID_PROD=(\S+)$', env_text, re.M)
          web_ids = [o.get('client_id') for o in web_clients]

          if web_match is None:
              print('::error::GOOGLE_OAUTH_WEB_CLIENT_ID_PROD is missing from .env, so '
                    'GoogleSignInService would initialize without a serverClientId. '
                    'Android cannot mint a usable ID token without one.')
              failed = True
          elif not web_clients:
              # Firebase does not always list the web client here, so an empty list is
              # not evidence the injected value is wrong -- only that nothing in this
              # file can confirm it. Say so rather than guessing either way.
              print(f'::warning::{CONFIG} lists no web OAuth client, so '
                    'GOOGLE_OAUTH_WEB_CLIENT_ID_PROD cannot be verified from it. An '
                    'audience that is not a client of this project is rejected at the '
                    'token endpoint, so if sign-in fails with invalid_audience, check '
                    'this value against Firebase > Authentication > Sign-in method > '
                    'Google > Web SDK configuration before looking anywhere else.')
          elif web_match.group(1) not in web_ids:
              print(f'::error::GOOGLE_OAUTH_WEB_CLIENT_ID_PROD is {web_match.group(1)}, which '
                    f'is not a web client of this project. {CONFIG} lists {", ".join(web_ids)}. '
                    'Google rejects an audience that is not a client of the project, so '
                    'sign-in fails with invalid_audience.')
              failed = True
          else:
              print(f'serverClientId {web_match.group(1)} is a web client of this project')

          # The ID token audience the app asks for has to belong to the same Firebase
          # project as this config, or Firebase rejects the credential.
          env_text = open('.env').read()
          for key in ('GOOGLE_OAUTH_WEB_CLIENT_ID_PROD', 'GOOGLE_OAUTH_IOS_CLIENT_ID_PROD'):
              match = re.search(rf'^{key}=(\S+)$', env_text, re.M)
              if match is None:
                  print(f'::error::{key} is missing from .env, so GoogleSignInService '
                        'would initialize without it.')
                  failed = True
                  continue
              value = match.group(1)
              if not value.startswith(f'{project_number}-'):
                  print(f'::error::{key} belongs to project {value.split("-")[0]}, but '
                        f'{CONFIG} is project {project_number}.')
                  failed = True
              else:
                  print(f'{key} matches project {project_number}')

          if failed:
              sys.exit(1)
          print('Google Sign-In configuration looks consistent.')
          PY

      - name: Build Android App Bundle (prodRelease)
        env:
          # Disable the Gradle daemon and file-system watching on CI to reduce
          # memory/resource usage. Parallel builds are intentionally NOT enabled
          # because they raise peak memory and can trigger runner termination.
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: |
          echo "📦 Building Android App Bundle (prod release for beta)..."
          echo "Using flavor: prod"
          echo "Using ENVIRONMENT: production"
          flutter build appbundle --release --flavor prod --dart-define=ENVIRONMENT=production
          echo "✅ Build complete!"

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy to Play Store Open Testing with Fastlane
        working-directory: android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "☁️  Uploading and publishing to Play Store Open Testing (Beta) track..."
          
          # Create temp file for service account JSON
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ../play-store-service-account.json
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="../play-store-service-account.json"
          
          bundle exec fastlane deploy_beta_open
          
          echo ""
          echo "🎉 Beta build published to Play Store Open Testing!"

  build_ios:
    name: Build and Deploy iOS (Beta TestFlight)
    # Preview image: the only GitHub-hosted runner carrying Xcode 27 / the iOS 27
    # SDK, which App Store Connect requires for uploads from April 2027 (ITMS-90725).
    runs-on: xcode-27
    needs: bump_version
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      
      - name: Pull latest changes (including version bump)
        run: |
          git pull origin beta
          echo "📱 Current version after pull:"
          grep '^version:' pubspec.yaml

      - name: Select Xcode 27
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -Vr | head -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "❌ Xcode 27 is required for App Store uploads. Installed Xcode versions:"
            ls /Applications | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected Xcode:"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      # Flutter 3.47 enables Swift Package Manager by default, which stops
      # SPM-migrated plugins from being declared as pods. google_mobile_ads
      # still declares webview_flutter_wkwebview as a podspec dependency, so
      # pod install then fails to resolve it. Lift this once google_mobile_ads
      # is upgraded and the project moves to SPM.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          ENVIRONMENT=production
          FIREBASE_PROD_IOS_API_KEY=${{ secrets.FIREBASE_PROD_IOS_API_KEY }}
          FIREBASE_PROD_IOS_APP_ID=${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
          FIREBASE_PROD_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}
          FIREBASE_PROD_PROJECT_ID=${{ secrets.FIREBASE_PROD_PROJECT_ID }}
          FIREBASE_PROD_AUTH_DOMAIN=${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}
          FIREBASE_PROD_STORAGE_BUCKET=${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}
          IOS_BUNDLE_ID=${{ secrets.IOS_BUNDLE_ID }}

          # Google Sign-In OAuth client IDs. Literals rather than secrets: OAuth client
          # IDs are public identifiers, and these exact values are already committed in
          # google-services.json and GoogleService-Info.plist. The client *secret* is
          # never needed here — the app only ever performs the public client flow.
          GOOGLE_OAUTH_WEB_CLIENT_ID_PROD=1069925301177-9lo5bht5kis83tpcsnd8lsi10au52878.apps.googleusercontent.com
          GOOGLE_OAUTH_IOS_CLIENT_ID_PROD=1069925301177-5mrbhfnct3l39g1vj6tlhvfmcug4vi11.apps.googleusercontent.com

          # Google Maps SDK keys. Restricted to the Maps SDK and bound to the iOS
          # bundle id / Android package + signing certs. Secrets, unlike the OAuth
          # client ids above: a Maps key is billable if it escapes its restrictions.
          GOOGLE_MAPS_IOS_API_KEY=${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          EOF

      - name: Create GoogleService-Info.plist for prod
        run: |
          mkdir -p ios/Firebase/prod
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}" > ios/Firebase/prod/GoogleService-Info.plist
          plutil -lint ios/Firebase/prod/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist created"

      - name: Verify Google Sign-In configuration (iOS)
        run: |
          PLIST=ios/Firebase/prod/GoogleService-Info.plist
          failed=0

          reversed_id=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$PLIST" 2>/dev/null || true)
          client_id=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" "$PLIST" 2>/dev/null || true)

          # firebase-setup.sh patches the callback URL scheme into the built
          # Info.plist from REVERSED_CLIENT_ID. It only warns when the key is
          # absent, and a warning is easy to lose in xcodebuild output -- the
          # symptom reaches testers instead, as a picker that never comes back.
          if [ -z "$reversed_id" ]; then
            echo "::error::REVERSED_CLIENT_ID missing from $PLIST. No callback URL scheme will be added, so Google Sign-In will open and never return to the app. Enable Google as a sign-in provider on the Firebase project and re-download GoogleService-Info.plist."
            failed=1
          else
            echo "REVERSED_CLIENT_ID present ($reversed_id)"
          fi

          if [ -z "$client_id" ]; then
            echo "::error::CLIENT_ID missing from $PLIST, so GIDClientID cannot be set."
            failed=1
          else
            echo "CLIENT_ID present"
          fi

          # The app passes AppConfig.googleIosClientId to GoogleSignIn.initialize,
          # while firebase-setup.sh writes GIDClientID from this plist. If the two
          # disagree the flow is authenticating against a different OAuth client
          # than the bundle is configured for.
          env_client_id=$(sed -n 's/^GOOGLE_OAUTH_IOS_CLIENT_ID_PROD=//p' .env)
          if [ -z "$env_client_id" ]; then
            echo "::error::GOOGLE_OAUTH_IOS_CLIENT_ID_PROD is missing from .env."
            failed=1
          elif [ -n "$client_id" ] && [ "$env_client_id" != "$client_id" ]; then
            echo "::error::GOOGLE_OAUTH_IOS_CLIENT_ID_PROD ($env_client_id) does not match CLIENT_ID in $PLIST ($client_id)."
            failed=1
          elif [ -n "$client_id" ]; then
            echo "GOOGLE_OAUTH_IOS_CLIENT_ID_PROD matches the plist CLIENT_ID"
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Google Sign-In configuration looks consistent."

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Setup GCP credentials for Match
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p ~/.config/gcloud
          printf '%s\n' "$GCP_SERVICE_ACCOUNT_KEY" > ~/.config/gcloud/application_default_credentials.json

      - name: Setup App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Sync iOS code signing certificates with Match
        working-directory: ios
        env:
          MATCH_GCS_BUCKET: ${{ secrets.MATCH_GCS_BUCKET }}
          MATCH_GCS_PROJECT_ID: ${{ secrets.MATCH_GCS_PROJECT_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          echo "🔐 Syncing code signing certificates and provisioning profiles..."
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
          bundle exec fastlane sync_prod_signing
          echo "✅ Code signing setup complete!"

      - name: Configure Flutter build settings (dart-defines)
        run: |
          # Writes ENVIRONMENT=production into ios/Flutter/Generated.xcconfig so the
          # gym/xcodebuild archive (run by Fastlane) compiles with the right config.
          # --config-only skips the redundant full IPA build; Fastlane re-archives.
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define=ENVIRONMENT=production

      - name: Deploy to TestFlight Beta with Fastlane
        working-directory: ios
        env:
          MATCH_GCS_BUCKET: ${{ secrets.MATCH_GCS_BUCKET }}
          MATCH_GCS_PROJECT_ID: ${{ secrets.MATCH_GCS_PROJECT_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json"
          export APP_STORE_CONNECT_API_KEY_KEY_FILEPATH="$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          
          # Deploy with Fastlane
          bundle exec fastlane deploy_beta
          
          echo ""
          echo "🎉 Beta build deployed to TestFlight Beta Testing!"

  build_web:
    name: Build and Deploy Web (Beta Channel)
    runs-on: ubuntu-latest
    needs: bump_version
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      
      - name: Pull latest changes (including version bump)
        run: |
          git pull origin beta
          echo "📱 Current version after pull:"
          grep '^version:' pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      # Flutter 3.47 enables Swift Package Manager by default, which stops
      # SPM-migrated plugins from being declared as pods. google_mobile_ads
      # still declares webview_flutter_wkwebview as a podspec dependency, so
      # pod install then fails to resolve it. Lift this once google_mobile_ads
      # is upgraded and the project moves to SPM.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          ENVIRONMENT=production
          FIREBASE_PROD_WEB_API_KEY=${{ secrets.FIREBASE_PROD_WEB_API_KEY }}
          FIREBASE_PROD_WEB_APP_ID=${{ secrets.FIREBASE_PROD_WEB_APP_ID }}
          FIREBASE_PROD_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_PROD_WEB_MEASUREMENT_ID }}
          FIREBASE_PROD_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}
          FIREBASE_PROD_PROJECT_ID=${{ secrets.FIREBASE_PROD_PROJECT_ID }}
          FIREBASE_PROD_AUTH_DOMAIN=${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}
          FIREBASE_PROD_STORAGE_BUCKET=${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}
          IOS_BUNDLE_ID=${{ secrets.IOS_BUNDLE_ID }}

          # Google Sign-In OAuth client IDs. Literals rather than secrets: OAuth client
          # IDs are public identifiers, and these exact values are already committed in
          # google-services.json and GoogleService-Info.plist. The client *secret* is
          # never needed here — the app only ever performs the public client flow.
          GOOGLE_OAUTH_WEB_CLIENT_ID_PROD=1069925301177-9lo5bht5kis83tpcsnd8lsi10au52878.apps.googleusercontent.com
          GOOGLE_OAUTH_IOS_CLIENT_ID_PROD=1069925301177-5mrbhfnct3l39g1vj6tlhvfmcug4vi11.apps.googleusercontent.com

          # Google Maps SDK keys. Restricted to the Maps SDK and bound to the iOS
          # bundle id / Android package + signing certs. Secrets, unlike the OAuth
          # client ids above: a Maps key is billable if it escapes its restrictions.
          GOOGLE_MAPS_IOS_API_KEY=${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          EOF

      - name: Build Web (Beta)
        run: |
          echo "📦 Building web app (prod config for beta)..."
          flutter build web \
            --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=FIREBASE_PROD_WEB_API_KEY=${{ secrets.FIREBASE_PROD_WEB_API_KEY }} \
            --dart-define=FIREBASE_PROD_WEB_APP_ID=${{ secrets.FIREBASE_PROD_WEB_APP_ID }} \
            --dart-define=FIREBASE_PROD_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROD_PROJECT_ID=${{ secrets.FIREBASE_PROD_PROJECT_ID }} \
            --dart-define=FIREBASE_PROD_AUTH_DOMAIN=${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_PROD_STORAGE_BUCKET=${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_PROD_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_PROD_WEB_MEASUREMENT_ID }} \
            --dart-define=GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_PROD_API_KEY }}
          echo "✅ Build complete!"

      - name: Deploy to Firebase Hosting Beta Channel
        run: |
          echo "☁️  Deploying to Firebase Hosting beta channel..."
          echo '${{ secrets.MAYPOLE_FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud-service-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-service-key.json
          npm install -g firebase-tools
          
          # Create beta channel if it doesn't exist
          firebase hosting:channel:create beta --project maypole-flutter-ce6c3 --non-interactive || true
          
          # Deploy to persistent beta channel
          firebase hosting:channel:deploy beta --project maypole-flutter-ce6c3 --non-interactive
          
          echo ""
          echo "🎉 Web beta deployed to Firebase Hosting!"
